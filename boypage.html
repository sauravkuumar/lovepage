<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to top right, #ffe4e1, #fff0f5);
      overflow: hidden;
    }

    .hearts-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: url('https://i.ibb.co/WGKzS8x/heart-icon.png');
      background-size: 40px;
      opacity: 0.05;
      animation: scrollHearts 30s linear infinite;
      z-index: 0;
    }

    @keyframes scrollHearts {
      0% { background-position: 0 0; }
      100% { background-position: 0 -2000px; }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 100px auto;
      text-align: center;
      padding: 30px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: #ff69b4;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      color: #333;
      margin: 10px 0;
      line-height: 1.6;
    }

    .heart {
      font-size: 2rem;
      animation: pulse 1.5s infinite;
      color: red;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .love-note {
      margin-top: 20px;
      font-size: 1.1rem;
      font-style: italic;
      color: #b22222;
      animation: slideIn 1s ease-out;
    }

    @keyframes slideIn {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .btn {
      margin-top: 30px;
      background: #ff69b4;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #ff1493;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="hearts-bg"></div>

  <div class="content">
    <h1>For You, My Love 💖</h1>
    <p class="heart">❤️</p>
    <p>I may not be perfect...</p>
    <p>But every beat of my heart whispers your name.</p>
    <p>I promise to stand by your side...</p>
    <p>In smiles and in tears, in chaos and calm.</p>
    <p class="love-note">You’re not just a dream, you’re my reason to dream 🌙</p>

    <button class="btn" onclick="window.history.back()">Go Back to Chat</button>
  </div>

</body>
<script>
    document.addEventListener('contextmenu', event => event.preventDefault());
  
    document.onkeydown = function(e) {
      if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        return false;
      }
  
      if (e.keyCode === 123) {
        return false;
      }
  
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        return false;
      }
  
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        return false;
      }
  
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        return false;
      }
    };
  </script>
</html>
